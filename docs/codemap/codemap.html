<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive code map</title>
<style>
:root{color-scheme:dark;--bg:#07101e;--panel:#0d1929;--panel2:#111f33;--line:#30445f;--text:#e5efff;--muted:#91a6c4;--accent:#66d9ff;--up:#ffcf66;--down:#71e5a1;--flow:#d28cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#10243d 0,var(--bg) 42%);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
header{height:112px;padding:14px 18px 10px;border-bottom:1px solid #263a55;background:#091523e8;backdrop-filter:blur(12px)}
.topline{display:flex;align-items:baseline;gap:12px}.topline h1{font-size:20px;margin:0}.meta{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}input,select,button{border:1px solid #314866;background:#0d1a2b;color:var(--text);border-radius:7px;padding:7px 9px}input{width:240px}select{max-width:300px}button{cursor:pointer}button:hover{border-color:var(--accent)}
.legend{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.legend span{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:11px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
#workspace{height:calc(100vh - 112px);display:grid;grid-template-columns:minmax(0,1fr) 330px}#graphWrap{position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}svg.panning{cursor:grabbing}
#details{border-left:1px solid #263a55;background:#0a1625e8;overflow:auto;padding:14px}#details h2{font-size:15px;margin:0 0 4px}#details h3{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}#details p,#details li{color:#b8c8df}#details ul{margin:4px 0;padding-left:18px}.path{font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8fdcf4;word-break:break-all}.chip{display:inline-block;padding:2px 6px;border:1px solid #38506f;border-radius:99px;color:#a9bdd8;margin:2px 3px 2px 0;font-size:10px}
.boundary{fill:#12243a55;stroke:#466181;stroke-width:1.2;stroke-dasharray:7 6}.boundary-label{fill:#7894b9;font-size:11px;font-weight:700;letter-spacing:.08em}.edge{fill:none;stroke:#4a607d;stroke-width:1.4;opacity:.45;marker-end:url(#arrow)}.edge-label{fill:#6f88aa;font-size:9px}.edge.upstream{stroke:var(--up);opacity:1;stroke-width:2.4}.edge.downstream{stroke:var(--down);opacity:1;stroke-width:2.4}.edge.flow{stroke:var(--flow);opacity:1;stroke-width:3}.edge.dim{opacity:.08}
.node{cursor:move}.node rect{stroke:#3c5778;stroke-width:1.2;rx:10;filter:drop-shadow(0 5px 8px #0007)}.node text{pointer-events:none}.node .title{fill:#f3f7ff;font-weight:700;font-size:11px}.node .subtitle{fill:#a9bdd8;font-size:9px}.node.selected rect{stroke:#fff;stroke-width:3}.node.upstream rect{stroke:var(--up);stroke-width:2.6}.node.downstream rect{stroke:var(--down);stroke-width:2.6}.node.flow rect{stroke:var(--flow);stroke-width:3}.node.dim{opacity:.16}.node.hidden{display:none}
.badge{position:absolute;left:12px;bottom:12px;background:#0b1727dd;border:1px solid #304661;border-radius:8px;padding:7px 9px;color:var(--muted);font-size:11px;pointer-events:none}
@media(max-width:900px){#workspace{grid-template-columns:1fr}#details{display:none}.legend{display:none}input{width:180px}}
</style>
</head>
<body>
<header>
  <div class="topline"><h1 id="repoName">Code map</h1><span class="meta" id="metadata"></span></div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search module, path, role…">
    <select id="typeFilter"><option value="">All module types</option></select>
    <select id="flowSelect"><option value="">Select an end-to-end flow</option></select>
    <button id="zoomIn" title="Zoom in">＋</button><button id="zoomOut" title="Zoom out">−</button><button id="fit" title="Fit graph">Fit</button><button id="reset" title="Clear selection">Reset</button>
    <div class="legend" id="legend"></div>
  </div>
</header>
<div id="workspace">
  <div id="graphWrap"><svg id="graph" aria-label="Interactive module dependency graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6983a6"/></marker></defs><g id="viewport"><g id="boundaries"></g><g id="edges"></g><g id="nodes"></g></g></svg><div class="badge">Wheel: zoom · drag background: pan · drag module: reposition · click module: impact view</div></div>
  <aside id="details"><h2>System overview</h2><p>Click a module to see callers, dependencies, tests, constraints, evidence, and participating flows. Choose a flow to highlight its complete path.</p></aside>
</div>

const positions=new Map();let transform={x:30,y:30,k:1};let selectedNode=null;let selectedFlow=null;let dragNode=null;let pan=null;
const svg=document.getElementById('graph'),viewport=document.getElementById('viewport'),nodeLayer=document.getElementById('nodes'),edgeLayer=document.getElementById('edges'),boundaryLayer=document.getElementById('boundaries');
const NS='http://www.w3.org/2000/svg',W=190,H=64,XGAP=285,YGAP=105;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('repoName').textContent='Time Series · interactive code map';
document.getElementById('metadata').textContent=`generated ${data.generated_at} · commit ${data.generated_from_commit}`;
const types=[...new Set(data.nodes.map(n=>n.type))].sort();
const typeFilter=document.getElementById('typeFilter');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;typeFilter.append(o)});
const flowSelect=document.getElementById('flowSelect');data.flows.forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=f.label;flowSelect.append(o)});
const legend=document.getElementById('legend');types.forEach(t=>{const s=document.createElement('span');s.innerHTML=`<i class="dot" style="background:${palette[t]||'#66788f'}"></i>${esc(t)}`;legend.append(s)});
function layeredOrder(){const layers=new Map();data.nodes.forEach(n=>{if(!layers.has(n.layer))layers.set(n.layer,[]);layers.get(n.layer).push(n.id)});const keys=[...layers.keys()].sort((a,b)=>a-b);keys.forEach(k=>layers.get(k).sort());const neighbors=new Map(data.nodes.map(n=>[n.id,[]]));data.edges.forEach(e=>{neighbors.get(e.from)?.push(e.to);neighbors.get(e.to)?.push(e.from)});for(let pass=0;pass<6;pass++){const sweep=pass%2?keys.slice().reverse():keys;const order=new Map();keys.forEach(k=>layers.get(k).forEach((id,i)=>order.set(id,i)));sweep.forEach(k=>layers.get(k).sort((a,b)=>{const score=id=>{const ns=neighbors.get(id).filter(x=>order.has(x));return ns.length?ns.reduce((v,x)=>v+order.get(x),0)/ns.length:order.get(id)};return score(a)-score(b)||a.localeCompare(b)}))}return {layers,keys}}
function layout(){const {layers,keys}=layeredOrder();keys.forEach((layer,xi)=>{const ids=layers.get(layer);ids.forEach((id,yi)=>positions.set(id,{x:xi*XGAP,y:yi*YGAP}))})}
function svgEl(name,attrs={}){const el=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el}
function shorten(s,n=27){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function edgePath(a,b){const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,dx=Math.max(55,(x2-x1)*.48);return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`}
function render(){nodeLayer.replaceChildren();edgeLayer.replaceChildren();boundaryLayer.replaceChildren();const groups=new Map();data.nodes.forEach(n=>{if(!groups.has(n.boundary))groups.set(n.boundary,[]);groups.get(n.boundary).push(n.id)});groups.forEach((ids,label)=>{const ps=ids.map(id=>positions.get(id));const minX=Math.min(...ps.map(p=>p.x))-18,minY=Math.min(...ps.map(p=>p.y))-30,maxX=Math.max(...ps.map(p=>p.x))+W+18,maxY=Math.max(...ps.map(p=>p.y))+H+18;const r=svgEl('rect',{class:'boundary',x:minX,y:minY,width:maxX-minX,height:maxY-minY,rx:14});boundaryLayer.append(r);const t=svgEl('text',{class:'boundary-label',x:minX+10,y:minY+18});t.textContent=label;boundaryLayer.append(t)});
data.edges.forEach((e,i)=>{const a=positions.get(e.from),b=positions.get(e.to);const p=svgEl('path',{class:'edge',d:edgePath(a,b),'data-edge':i});edgeLayer.append(p);const mid=svgEl('text',{class:'edge-label','data-label':i});mid.textContent=e.type;edgeLayer.append(mid)});
data.nodes.forEach(n=>{const p=positions.get(n.id),g=svgEl('g',{class:'node','data-id':n.id,transform:`translate(${p.x} ${p.y})`});const r=svgEl('rect',{width:W,height:H,fill:palette[n.type]||'#52677e'});g.append(r);const title=svgEl('text',{class:'title',x:11,y:23});title.textContent=shorten(n.label,30);g.append(title);const sub=svgEl('text',{class:'subtitle',x:11,y:43});sub.textContent=shorten(n.path,34);g.append(sub);g.addEventListener('click',ev=>{ev.stopPropagation();selectedNode=n.id;selectedFlow=null;flowSelect.value='';showNode(n.id);applyState()});g.addEventListener('pointerdown',ev=>{ev.stopPropagation();dragNode={id:n.id,lastX:ev.clientX,lastY:ev.clientY};g.setPointerCapture(ev.pointerId)});nodeLayer.append(g)});updateGeometry();applyState()}
function updateGeometry(){viewport.setAttribute('transform',`translate(${transform.x} ${transform.y}) scale(${transform.k})`);data.nodes.forEach(n=>{const p=positions.get(n.id),g=nodeLayer.querySelector(`[data-id="${n.id}"]`);if(g)g.setAttribute('transform',`translate(${p.x} ${p.y})`)});data.edges.forEach((e,i)=>{const a=positions.get(e.from),b=positions.get(e.to),p=edgeLayer.querySelector(`[data-edge="${i}"]`),t=edgeLayer.querySelector(`[data-label="${i}"]`);if(p)p.setAttribute('d',edgePath(a,b));if(t){t.setAttribute('x',(a.x+b.x+W)/2);t.setAttribute('y',(a.y+b.y+H)/2-4)}})}
function flowEdges(flow){const pairs=new Set();for(let i=0;i<flow.steps.length-1;i++){pairs.add(`${flow.steps[i]}|${flow.steps[i+1]}`);pairs.add(`${flow.steps[i+1]}|${flow.steps[i]}`)}return pairs}
function applyState(){const q=document.getElementById('search').value.trim().toLowerCase(),type=typeFilter.value;const upstream=new Set(),downstream=new Set(),flowNodes=new Set(),fEdges=new Set();if(selectedNode){data.edges.forEach(e=>{if(e.to===selectedNode)upstream.add(e.from);if(e.from===selectedNode)downstream.add(e.to)})}if(selectedFlow){const f=data.flows.find(x=>x.id===selectedFlow);f.steps.forEach(x=>flowNodes.add(x));flowEdges(f).forEach(x=>fEdges.add(x))}data.nodes.forEach(n=>{const el=nodeLayer.querySelector(`[data-id="${n.id}"]`);el.className.baseVal='node';const hay=[n.id,n.label,n.path,n.role,...(n.entrypoints||[])].join(' ').toLowerCase();const hidden=(type&&n.type!==type)||(q&&!hay.includes(q));if(hidden)el.classList.add('hidden');if(selectedNode===n.id)el.classList.add('selected');else if(upstream.has(n.id))el.classList.add('upstream');else if(downstream.has(n.id))el.classList.add('downstream');if(flowNodes.has(n.id))el.classList.add('flow');if((selectedNode&&!upstream.has(n.id)&&!downstream.has(n.id)&&selectedNode!==n.id)||(selectedFlow&&!flowNodes.has(n.id)))el.classList.add('dim')});data.edges.forEach((e,i)=>{const el=edgeLayer.querySelector(`[data-edge="${i}"]`);el.setAttribute('class','edge');if(selectedNode&&e.to===selectedNode)el.classList.add('upstream');else if(selectedNode&&e.from===selectedNode)el.classList.add('downstream');else if(selectedNode)el.classList.add('dim');if(selectedFlow){if(fEdges.has(`${e.from}|${e.to}`))el.classList.add('flow');else el.classList.add('dim')}})}
function list(title,items){return items?.length?`<h3>${esc(title)}</h3><ul>${items.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>`:''}
function showNode(id){const n=nodeById.get(id),callers=data.edges.filter(e=>e.to===id).map(e=>`${e.from} · ${e.type}`),deps=data.edges.filter(e=>e.from===id).map(e=>`${e.to} · ${e.type}`),flows=data.flows.filter(f=>f.steps.includes(id)).map(f=>f.label);document.getElementById('details').innerHTML=`<h2>${esc(n.label)}</h2><div class="path">${esc(n.path)}</div><span class="chip">${esc(n.type)}</span><span class="chip">${esc(n.boundary)}</span><p>${esc(n.role)}</p>${list('Upstream callers',callers)}${list('Downstream effects',deps)}${list('Related tests',n.tests)}${list('Flows',flows)}${list('Entrypoints',n.entrypoints)}${list('Constraints',n.constraints)}${list('Source evidence',(n.evidence||[]).map(e=>`${e.path} :: ${e.symbol}`))}`}
function showFlow(id){const f=data.flows.find(x=>x.id===id);document.getElementById('details').innerHTML=`<h2>${esc(f.label)}</h2><p><b>Trigger:</b> ${esc(f.trigger)}</p>${list('Complete path',f.steps.map((x,i)=>`${i+1}. ${nodeById.get(x)?.label||x}`))}<h3>Outcome</h3><p>${esc(f.outcome)}</p>`}
function fit(){const ps=[...positions.values()];const minX=Math.min(...ps.map(p=>p.x))-45,minY=Math.min(...ps.map(p=>p.y))-45,maxX=Math.max(...ps.map(p=>p.x))+W+45,maxY=Math.max(...ps.map(p=>p.y))+H+45;const rect=svg.getBoundingClientRect();transform.k=Math.min(rect.width/(maxX-minX),rect.height/(maxY-minY),1.15);transform.x=(rect.width-(maxX-minX)*transform.k)/2-minX*transform.k;transform.y=(rect.height-(maxY-minY)*transform.k)/2-minY*transform.k;updateGeometry()}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top,old=transform.k,next=Math.max(.22,Math.min(2.5,old*Math.exp(-ev.deltaY*.001)));transform.x=mx-(mx-transform.x)*next/old;transform.y=my-(my-transform.y)*next/old;transform.k=next;updateGeometry()},{passive:false});
svg.addEventListener('pointerdown',ev=>{if(ev.target===svg){pan={x:ev.clientX,y:ev.clientY,tx:transform.x,ty:transform.y};svg.classList.add('panning');svg.setPointerCapture(ev.pointerId)}});svg.addEventListener('pointermove',ev=>{if(dragNode){const p=positions.get(dragNode.id);p.x+=(ev.clientX-dragNode.lastX)/transform.k;p.y+=(ev.clientY-dragNode.lastY)/transform.k;dragNode.lastX=ev.clientX;dragNode.lastY=ev.clientY;updateGeometry()}else if(pan){transform.x=pan.tx+ev.clientX-pan.x;transform.y=pan.ty+ev.clientY-pan.y;updateGeometry()}});svg.addEventListener('pointerup',()=>{dragNode=null;pan=null;svg.classList.remove('panning')});svg.addEventListener('click',ev=>{if(ev.target===svg){selectedNode=null;applyState()}});
document.getElementById('search').addEventListener('input',applyState);typeFilter.addEventListener('change',applyState);flowSelect.addEventListener('change',()=>{selectedFlow=flowSelect.value||null;selectedNode=null;if(selectedFlow)showFlow(selectedFlow);applyState()});document.getElementById('zoomIn').onclick=()=>{transform.k=Math.min(2.5,transform.k*1.2);updateGeometry()};document.getElementById('zoomOut').onclick=()=>{transform.k=Math.max(.22,transform.k/1.2);updateGeometry()};document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{selectedNode=null;selectedFlow=null;flowSelect.value='';typeFilter.value='';document.getElementById('search').value='';document.getElementById('details').innerHTML='<h2>System overview</h2><p>Click a module to see callers, dependencies, tests, constraints, evidence, and participating flows. Choose a flow to highlight its complete path.</p>';applyState();fit()};
layout();render();requestAnimationFrame(fit);
</script>
</body>
</html>
