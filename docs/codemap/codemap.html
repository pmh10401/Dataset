<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Time Series · Interactive Code Map</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#0d1823;--panel2:#111f2d;--line:#294157;--text:#e8f1f8;--muted:#8ca2b5;--accent:#71d1ff;--warn:#ffcb6b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#16314a 0,#071018 42%);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    header{height:88px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1d3041;background:#071018e8;backdrop-filter:blur(12px)}
    h1{font-size:21px;margin:0 0 5px;letter-spacing:.2px}.meta{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.header-stats{display:flex;gap:8px}.stat{padding:8px 11px;border:1px solid #243b4e;border-radius:9px;background:#0c1721;color:#bad0df}.stat b{color:#fff}
    .toolbar{height:58px;padding:9px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1d3041;background:#0a141e}.toolbar input,.toolbar select,.toolbar button{height:36px;border:1px solid #2a4256;border-radius:8px;background:#111f2d;color:var(--text);padding:0 10px}.toolbar input{width:240px}.toolbar button{cursor:pointer}.toolbar button:hover{border-color:var(--accent)}.spacer{flex:1}
    .legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px;color:#a9bdcb;font-size:11px}.legend i{width:9px;height:9px;border-radius:50%}
    main{display:grid;grid-template-columns:minmax(0,1fr) 330px;height:calc(100vh - 146px)}.canvas{position:relative;overflow:hidden}.canvas:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#17304455 1px,transparent 1px),linear-gradient(90deg,#17304455 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
    svg{width:100%;height:100%;display:block;touch-action:none}.boundary{fill:#10243444;stroke:#34536b;stroke-width:1;stroke-dasharray:6 5}.boundary-label{fill:#7190a5;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.edge{fill:none;stroke:#456176;stroke-width:1.45;opacity:.55;marker-end:url(#arrow)}.edge-label{fill:#7792a5;font-size:9px;paint-order:stroke;stroke:#071018;stroke-width:4}.edge.active{stroke:#8de3ff;stroke-width:3;opacity:1}.edge.dim{opacity:.08}.node{cursor:pointer}.node rect{fill:#10202d;stroke-width:1.4;rx:11;filter:url(#shadow)}.node:hover rect{stroke-width:2.5}.node .title{fill:#f1f7fb;font-weight:750;font-size:13px}.node .role{fill:#90a8b9;font-size:9.5px}.node .tag{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.node .count{fill:#668397;font-size:9px}.node.active rect{stroke:#f7f089!important;stroke-width:3;filter:url(#glow)}.node.upstream rect{stroke:#ff9bb5!important;stroke-width:2.5}.node.downstream rect{stroke:#8de3ff!important;stroke-width:2.5}.node.flow rect{stroke:#c8a5ff!important;stroke-width:3}.node.dim{opacity:.14}.empty{fill:#8ea5b5;font-size:18px}
    aside{border-left:1px solid #21374a;background:#0b1620;overflow:auto;padding:18px}aside h2{font-size:17px;margin:0 0 4px}aside h3{font-size:11px;color:#7290a5;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 8px}aside p{color:#b1c3cf;margin:7px 0}.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#77d7ff;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #294358;background:#10202d;border-radius:999px;padding:4px 7px;color:#bfd0da;font-size:10px}.chip.test{border-color:#526937;color:#d6ef9a;background:#182318}.chip.up{border-color:#81465a;color:#ffb4c5}.chip.down{border-color:#376d83;color:#9de8ff}.chip.flow{border-color:#6f5592;color:#d8bdff}.evidence{padding:7px 0;border-bottom:1px solid #172b3a}.evidence b{display:block;color:#dceaf2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}.evidence span{color:#6f8ba0;font-size:10px}.hint{position:absolute;left:14px;bottom:12px;padding:7px 10px;border:1px solid #294155;border-radius:8px;background:#09141ddd;color:#87a0b2;font-size:10px;pointer-events:none}.flow-card{border:1px solid #2d4355;border-radius:9px;padding:10px;background:#0f1d29}.flow-card strong{display:block;color:#d9c4ff;margin-bottom:4px}.flow-card small{color:#8ca4b5}
    @media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}.toolbar{overflow-x:auto}.legend{display:none}.header-stats{display:none}}
  </style>
</head>
<body>
  <header>
    <div><h1 id="repo-title">Time Series · Code Map</h1><div class="meta" id="meta"></div></div>
    <div class="header-stats"><div class="stat"><b id="node-count">0</b> modules</div><div class="stat"><b id="edge-count">0</b> links</div><div class="stat"><b id="flow-count">0</b> flows</div></div>
  </header>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search module, path, role…" aria-label="Search modules">
    <select id="type-filter" aria-label="Filter by module type"><option value="">All types</option></select>
    <select id="boundary-filter" aria-label="Filter by boundary"><option value="">All boundaries</option></select>
    <select id="flow-select" aria-label="Select a flow"><option value="">All flows</option></select>
    <button id="reset">Reset</button><div class="spacer"></div><div class="legend" id="legend"></div>
    <button id="zoom-out" title="Zoom out">−</button><button id="fit" title="Fit map">Fit</button><button id="zoom-in" title="Zoom in">+</button>
  </div>
  <main>
    <section class="canvas">
      <svg id="graph" viewBox="0 0 1600 980" role="img" aria-label="Interactive architecture graph">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66869b"/></marker>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".42"/></filter>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#efff8c" flood-opacity=".45"/></filter>
        </defs>
        <g id="viewport"><g id="boundaries"></g><g id="edges"></g><g id="edge-labels"></g><g id="nodes"></g></g>
      </svg>
      <div class="hint">Click a module · drag modules · drag background to pan · wheel to zoom</div>
    </section>
    <aside id="details"><h2>System overview</h2><p>Select a module or flow. Callers, dependencies, tests, and participating flows will be highlighted here.</p><h3>Scope</h3><div id="scope"></div></aside>
  </main>

    function render(){
      layout();boundaryLayer.replaceChildren();edgeLayer.replaceChildren();labelLayer.replaceChildren();nodeLayer.replaceChildren();
      const groups=new Map();for(const n of data.nodes.filter(n=>state.visible.has(n.id))){if(!groups.has(n.boundary))groups.set(n.boundary,[]);groups.get(n.boundary).push(state.positions.get(n.id))}
      for(const [name,ps] of groups){const minX=Math.min(...ps.map(p=>p.x))-22,maxX=Math.max(...ps.map(p=>p.x))+240,minY=Math.min(...ps.map(p=>p.y))-32,maxY=Math.max(...ps.map(p=>p.y))+104;boundaryLayer.append(el("rect",{class:"boundary",x:minX,y:minY,width:maxX-minX,height:maxY-minY,rx:16}));const t=el("text",{class:"boundary-label",x:minX+12,y:minY+18});t.textContent=name;boundaryLayer.append(t)}
      const activeFlow=data.flows.find(f=>f.id===state.flow),flowNodes=new Set(activeFlow?.steps||[]),up=state.selected?connected(state.selected,incoming):new Set(),down=state.selected?connected(state.selected,outgoing):new Set();
      for(const [i,e] of data.edges.entries()){if(!state.visible.has(e.from)||!state.visible.has(e.to))continue;const a=state.positions.get(e.from),b=state.positions.get(e.to),path=edgePath(a,b),flowEdge=activeFlow&&flowNodes.has(e.from)&&flowNodes.has(e.to),related=state.selected&&(e.from===state.selected||e.to===state.selected||up.has(e.from)&&up.has(e.to)||down.has(e.from)&&down.has(e.to));const p=el("path",{d:path,class:`edge ${(flowEdge||related)?"active":""} ${(state.selected||activeFlow)&&!(flowEdge||related)?"dim":""}`,"data-edge":i});edgeLayer.append(p);const mid=p.getPointAtLength(p.getTotalLength()/2),t=el("text",{class:`edge-label ${(state.selected||activeFlow)&&!(flowEdge||related)?"dim":""}`,x:mid.x,y:mid.y-4});t.textContent=e.type;labelLayer.append(t)}
      for(const n of data.nodes.filter(n=>state.visible.has(n.id))){const p=state.positions.get(n.id),classes=["node"];if(n.id===state.selected)classes.push("active");else if(up.has(n.id))classes.push("upstream");else if(down.has(n.id))classes.push("downstream");if(flowNodes.has(n.id))classes.push("flow");if((state.selected||activeFlow)&&n.id!==state.selected&&!up.has(n.id)&&!down.has(n.id)&&!flowNodes.has(n.id))classes.push("dim");const g=el("g",{class:classes.join(" "),transform:`translate(${p.x} ${p.y})`,"data-id":n.id,tabindex:0});g.append(el("rect",{width:218,height:78,stroke:colors[n.type]||"#aaa"}));const tag=el("text",{class:"tag",x:13,y:17,fill:colors[n.type]||"#aaa"});tag.textContent=n.type;g.append(tag);const title=el("text",{class:"title",x:13,y:38});title.textContent=n.label;g.append(title);const role=el("text",{class:"role",x:13,y:56});role.textContent=n.role.length>42?n.role.slice(0,42)+"…":n.role;g.append(role);const count=el("text",{class:"count",x:13,y:70});count.textContent=`${n.tests.length} tests · ${n.path}`.slice(0,48);g.append(count);g.addEventListener("click",ev=>{ev.stopPropagation();selectNode(n.id)});g.addEventListener("keydown",ev=>{if(ev.key==="Enter")selectNode(n.id)});g.addEventListener("pointerdown",ev=>{ev.stopPropagation();g.setPointerCapture(ev.pointerId);state.drag={id:n.id,startX:ev.clientX,startY:ev.clientY,x:p.x,y:p.y}});g.addEventListener("pointermove",ev=>{if(!state.drag||state.drag.id!==n.id)return;const q=state.positions.get(n.id);q.x=state.drag.x+(ev.clientX-state.drag.startX)/state.scale;q.y=state.drag.y+(ev.clientY-state.drag.startY)/state.scale;q.pinned=true;render()});g.addEventListener("pointerup",()=>state.drag=null);nodeLayer.append(g)}
      updateTransform();
    }
    function evidenceHtml(items){return items.map(e=>`<div class="evidence"><b>${esc(e.symbol)}</b><span>${esc(e.path)}</span></div>`).join("")}
    function selectNode(id){state.selected=id;state.flow=null;document.getElementById("flow-select").value="";const n=byId.get(id),up=connected(id,incoming),down=connected(id,outgoing),flows=data.flows.filter(f=>f.steps.includes(id));details.innerHTML=`<h2>${esc(n.label)}</h2><div class="path">${esc(n.path)}</div><p>${esc(n.role)}</p><h3>Callers / upstream</h3><div class="chips">${[...up].map(x=>`<span class="chip up">${esc(byId.get(x).label)}</span>`).join("")||"<span class='chip'>None in mapped scope</span>"}</div><h3>Dependencies / downstream</h3><div class="chips">${[...down].map(x=>`<span class="chip down">${esc(byId.get(x).label)}</span>`).join("")||"<span class='chip'>None in mapped scope</span>"}</div><h3>Related tests</h3><div class="chips">${n.tests.map(x=>`<span class="chip test">${esc(x)}</span>`).join("")||"<span class='chip'>No focused test found</span>"}</div><h3>Flows</h3><div class="chips">${flows.map(f=>`<span class="chip flow">${esc(f.label)}</span>`).join("")||"<span class='chip'>No mapped flow</span>"}</div><h3>Entrypoints</h3><div class="chips">${n.entrypoints.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><h3>Constraints</h3>${n.constraints.map(x=>`<p>• ${esc(x)}</p>`).join("")}<h3>Source evidence</h3>${evidenceHtml(n.evidence)}`;render()}
    function selectFlow(id){state.flow=id||null;state.selected=null;const f=data.flows.find(x=>x.id===id);if(f)details.innerHTML=`<h2>${esc(f.label)}</h2><div class="flow-card"><strong>Trigger</strong><small>${esc(f.trigger)}</small></div><h3>Complete path</h3><div class="chips">${f.steps.map((x,i)=>`<span class="chip flow">${i+1}. ${esc(byId.get(x).label)}</span>`).join("")}</div><h3>Outcome</h3><p>${esc(f.outcome)}</p>`;else details.innerHTML=`<h2>System overview</h2><p>Select a module or flow. Callers, dependencies, tests, and participating flows will be highlighted here.</p><h3>Scope</h3><div>${data.scope.map(s=>`<span class="chip">${esc(s)}</span>`).join(" ")}</div>`;render()}
    function applyFilters(){const q=document.getElementById("search").value.trim().toLowerCase(),type=document.getElementById("type-filter").value,boundary=document.getElementById("boundary-filter").value;state.visible=new Set(data.nodes.filter(n=>(!type||n.type===type)&&(!boundary||n.boundary===boundary)&&(!q||[n.label,n.path,n.role,...n.entrypoints].join(" ").toLowerCase().includes(q))).map(n=>n.id));render()}
    ["search","type-filter","boundary-filter"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",applyFilters));document.getElementById("flow-select").addEventListener("change",e=>selectFlow(e.target.value));
    document.getElementById("reset").addEventListener("click",()=>{state.selected=state.flow=null;state.positions.clear();state.visible=new Set(data.nodes.map(n=>n.id));["search","type-filter","boundary-filter","flow-select"].forEach(id=>document.getElementById(id).value="");state.scale=1;state.tx=0;state.ty=0;selectFlow(null);fit()});
    function zoom(mult,cx=800,cy=490){const next=Math.min(2.8,Math.max(.35,state.scale*mult));state.tx=cx-(cx-state.tx)*(next/state.scale);state.ty=cy-(cy-state.ty)*(next/state.scale);state.scale=next;updateTransform()}function fit(){state.scale=.82;state.tx=18;state.ty=48;updateTransform()}
    document.getElementById("zoom-in").onclick=()=>zoom(1.2);document.getElementById("zoom-out").onclick=()=>zoom(1/1.2);document.getElementById("fit").onclick=fit;svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,(e.clientX-r.left)*1600/r.width,(e.clientY-r.top)*980/r.height)},{passive:false});svg.addEventListener("pointerdown",e=>{if(e.target===svg||e.target.closest("#boundaries")){svg.setPointerCapture(e.pointerId);state.pan={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty}}});svg.addEventListener("pointermove",e=>{if(!state.pan)return;state.tx=state.pan.tx+(e.clientX-state.pan.x)*1600/svg.clientWidth;state.ty=state.pan.ty+(e.clientY-state.pan.y)*980/svg.clientHeight;updateTransform()});svg.addEventListener("pointerup",()=>state.pan=null);svg.addEventListener("click",e=>{if(e.target===svg)selectFlow(null)});
    render();fit();
  })();
  </script>
</body>
