name: PR27 review fixes antigravity v2

on:
  push:
    branches:
      - codex/pr27-review-fixes-antigravity-ci

permissions:
  contents: write

concurrency:
  group: pr27-review-fixes-antigravity-v2
  cancel-in-progress: false

env:
  BASE_HEAD_ANTIGRAVITY: 75c0f2484209f744e218b871b01777854fcee11c
  TARGET_BRANCH_ANTIGRAVITY: codex/exp470-ecg200-spectral-entropy-numba-antigravity
  GENERATED_AT_ANTIGRAVITY: 2026-08-30T00:00:00Z

jobs:
  green-fix-and-publish-antigravity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused verification dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest markdown numpy scipy scikit-learn numba 'aeon==1.4.0'

      - name: Apply review fixes with escaped-literal preservation
        run: python scratch/run_apply_pr27_review_fixes_v2_antigravity.py

      - name: Run focused GREEN verification before commit construction
        shell: bash
        run: |
          set -euo pipefail
          pytest -q scratch/test_run_exp472_zero_fp_tail_recovery_antigravity.py
          pytest -q \
            experiments/exp479_missing_score_recovery_antigravity/tests/test_population_antigravity.py \
            -k 'wrong_digest or population_manifest_pins_the_exact_sources'
          pytest -q \
            experiments/exp479_missing_score_recovery_antigravity/tests/test_runner_antigravity.py \
            -k 'resume_rejects_changed_sources_population_or_execution_mode or source_fingerprint_binds_all_transitive_result_sources'
          pytest -q \
            experiments/exp461_ecg_period_signature_qualification_antigravity/tests/test_scoring_antigravity.py
          pytest -q \
            experiments/exp462_ecg_gradual_signature_qualification_antigravity/tests/test_scoring_antigravity.py
          pytest -q scratch/test_codemap_exp472_473_479_antigravity.py
          python -m compileall -q \
            scratch/run_exp472_zero_fp_tail_recovery_antigravity.py \
            scratch/test_run_exp472_zero_fp_tail_recovery_antigravity.py \
            scratch/build_codemap_exp461_antigravity.py \
            scratch/build_codemap_exp462_antigravity.py \
            scratch/build_codemap_exp472_473_479_antigravity.py \
            scratch/test_codemap_exp472_473_479_antigravity.py \
            experiments/exp479_missing_score_recovery_antigravity
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          for relative in (
              '.superpowers/sdd/2026-08-21-exp464-ecg-residual-centered-ramp-confirmation-antigravity.html/task-4-report-antigravity.html',
              '.superpowers/sdd/2026-08-21-exp464-ecg-residual-centered-ramp-confirmation-antigravity.html/task-5-report-antigravity.html',
              '.superpowers/sdd/2026-08-22-exp465-ecg200-c8-external-validation-antigravity.html/progress-antigravity.html',
              '.superpowers/sdd/2026-08-23-exp466-ecg200-phase-registration-margin-antigravity.html/task-1-brief-antigravity.html',
          ):
              parser = HTMLParser()
              parser.feed(Path(relative).read_text(encoding='utf-8'))
              parser.close()
          PY
          git diff --check "$BASE_HEAD_ANTIGRAVITY"

      - name: Construct functional commit from the reviewed head
        id: functional
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --binary "$BASE_HEAD_ANTIGRAVITY" -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude)scratch/apply_pr27_review_fixes_antigravity.py' \
            ':(exclude)scratch/run_apply_pr27_review_fixes_v2_antigravity.py' \
            ':(exclude)pr27_source_fingerprint_antigravity.txt' \
            ':(exclude,glob)docs/codemap/**' \
            > /tmp/pr27_functional_antigravity.patch
          test -s /tmp/pr27_functional_antigravity.patch
          git reset --hard "$BASE_HEAD_ANTIGRAVITY"
          git clean -fdx
          git apply --index /tmp/pr27_functional_antigravity.patch
          git diff --cached --check
          git commit -m 'fix: address Exp472-479 review findings'
          functional_sha=$(git rev-parse HEAD)
          echo "sha=$functional_sha" >> "$GITHUB_OUTPUT"
          echo "$functional_sha" > /tmp/pr27_functional_sha_antigravity.txt

      - name: Regenerate all affected code-map triplets on the functional boundary
        shell: bash
        run: |
          set -euo pipefail
          functional_sha='${{ steps.functional.outputs.sha }}'
          python scratch/build_codemap_exp461_antigravity.py \
            --source-commit "$functional_sha" \
            --generated-at "$GENERATED_AT_ANTIGRAVITY"
          python scratch/build_codemap_exp462_antigravity.py \
            --source-commit "$functional_sha" \
            --generated-at "$GENERATED_AT_ANTIGRAVITY"
          python scratch/build_codemap_exp464_antigravity.py
          python scratch/build_codemap_exp465_antigravity.py
          python scratch/build_codemap_exp466_antigravity.py
          python scratch/build_codemap_exp472_473_479_antigravity.py \
            --source-commit "$functional_sha" \
            --generated-at "$GENERATED_AT_ANTIGRAVITY"
          git add docs/codemap
          git diff --cached --check
          git commit -m 'docs: synchronize Exp461-479 code maps'
          git rev-parse HEAD > /tmp/pr27_map_sha_antigravity.txt

      - name: Run post-commit verification on the exact proposed head
        shell: bash
        run: |
          set -euo pipefail
          pytest -q scratch/test_run_exp472_zero_fp_tail_recovery_antigravity.py
          pytest -q \
            experiments/exp479_missing_score_recovery_antigravity/tests/test_population_antigravity.py \
            -k 'wrong_digest or population_manifest_pins_the_exact_sources'
          pytest -q \
            experiments/exp479_missing_score_recovery_antigravity/tests/test_runner_antigravity.py \
            -k 'resume_rejects_changed_sources_population_or_execution_mode or source_fingerprint_binds_all_transitive_result_sources'
          pytest -q experiments/exp461_ecg_period_signature_qualification_antigravity/tests/test_scoring_antigravity.py
          pytest -q experiments/exp462_ecg_gradual_signature_qualification_antigravity/tests/test_scoring_antigravity.py
          pytest -q scratch/test_codemap_exp472_473_479_antigravity.py
          python scratch/build_codemap_exp461_antigravity.py --validate-only
          python scratch/build_codemap_exp462_antigravity.py --validate-only
          python scratch/build_codemap_exp464_antigravity.py --validate-only
          python scratch/build_codemap_exp465_antigravity.py --validate-only
          python scratch/build_codemap_exp466_antigravity.py --validate-only
          python scratch/build_codemap_exp472_473_479_antigravity.py --validate-only
          git diff --check "$BASE_HEAD_ANTIGRAVITY" HEAD
          test -z "$(git status --porcelain)"

      - name: Publish the verified two-commit fix to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH_ANTIGRAVITY"
          remote_sha=$(git rev-parse "origin/$TARGET_BRANCH_ANTIGRAVITY")
          test "$remote_sha" = "$BASE_HEAD_ANTIGRAVITY"
          git push origin "HEAD:$TARGET_BRANCH_ANTIGRAVITY"

      - name: Assemble verification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p pr27_review_fix_evidence_v2_antigravity
          cp /tmp/pr27_functional_sha_antigravity.txt \
            pr27_review_fix_evidence_v2_antigravity/functional_sha_antigravity.txt 2>/dev/null || true
          cp /tmp/pr27_map_sha_antigravity.txt \
            pr27_review_fix_evidence_v2_antigravity/map_sha_antigravity.txt 2>/dev/null || true
          git log -3 --oneline --decorate \
            > pr27_review_fix_evidence_v2_antigravity/git_log_antigravity.txt || true
          git diff --name-status "$BASE_HEAD_ANTIGRAVITY" HEAD \
            > pr27_review_fix_evidence_v2_antigravity/name_status_antigravity.txt || true
          git status --short \
            > pr27_review_fix_evidence_v2_antigravity/status_antigravity.txt || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr27-review-fix-evidence-v2-antigravity
          path: pr27_review_fix_evidence_v2_antigravity
          if-no-files-found: error
