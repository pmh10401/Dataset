name: Windows diagnosis service
on:
  push:
    branches: ['codex/windows-service-release-*']
    paths: ['services/time_series_anomaly_diagnosis/**', '.github/workflows/windows_service_antigravity.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      NUMBA_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r services/time_series_anomaly_diagnosis/packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test service and release contracts
        run: python -m unittest services.time_series_anomaly_diagnosis.tests.test_service_launcher services.time_series_anomaly_diagnosis.tests.test_packaging services.time_series_anomaly_diagnosis.tests.test_release_bundle services.time_series_anomaly_diagnosis.tests.test_cross_platform_service services.time_series_anomaly_diagnosis.tests.test_web_interface
      - name: Build Windows executable
        run: python services/time_series_anomaly_diagnosis/packaging/build_package.py --clean --output dist/windows
      - name: Test packaged analysis and restart
        run: python -m services.time_series_anomaly_diagnosis.packaging.smoke_executable --executable dist/windows/TimeSeriesAnomalyDiagnosis/TimeSeriesAnomalyDiagnosis.exe --report dist/windows/TimeSeriesAnomalyDiagnosis/windows_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verified-application
          path: dist/windows/TimeSeriesAnomalyDiagnosis/
          if-no-files-found: error
          retention-days: 7
